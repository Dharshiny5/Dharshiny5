<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Thanks for stopping by."><title>Thanks for stopping by.</title><style>
.flow{stroke-dasharray:6 8;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.5" fill="#435062"/></pattern></defs><rect width="1200" height="96" rx="18" fill="#202833"/><rect width="1200" height="96" rx="18" fill="url(#dots)"/><rect x="0.5" y="0.5" width="1199" height="95" rx="18" fill="none" stroke="#435062"/><line class="flow" x1="64" y1="48" x2="400" y2="48" stroke="#A79E89" stroke-width="1.5"/><line class="flow" x1="800" y1="48" x2="1136" y2="48" stroke="#A79E89" stroke-width="1.5"/><circle r="5" fill="#EAE0C8"><animateMotion dur="4s" repeatCount="indefinite" path="M64,48 L400,48"/></circle><circle r="5" fill="#EAE0C8"><animateMotion dur="4s" repeatCount="indefinite" path="M800,48 L1136,48"/></circle><text x="600" y="54" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#F7F5EF">Thanks for stopping by.</text></svg>
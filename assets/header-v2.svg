<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Dharshini Balakrishnan. AI, data and business analytics. Agentic RAG for regulated domains."><title>Dharshini Balakrishnan. AI, data and business analytics. Agentic RAG for regulated domains.</title><style>
